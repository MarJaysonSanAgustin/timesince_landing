name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      - name: Verify content, contrast, types, lint and build
        run: npm run verify

      - name: Check built SEO routes
        shell: bash
        run: |
          PORT=3102 HOSTNAME=127.0.0.1 node .next/standalone/server.js > /tmp/timesince-seo-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3102/guides > /dev/null; then
              break
            fi
            sleep 1
          done
          npm run check:seo -- http://127.0.0.1:3102
